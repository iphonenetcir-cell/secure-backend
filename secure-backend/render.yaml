services:
  - type: web
    name: secure-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: SecurePass123!
      - key: ADMIN_API_KEY
        value: YourSecretAPIKey456!
      - key: ALLOWED_ORIGINS
        value: https://www.w3schools.com,https://www.w3schools.com/tryit,http://localhost:5500,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.11.0